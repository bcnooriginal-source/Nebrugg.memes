<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stranger Moon /// terminal</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background: #0d0f0e;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Courier New', Courier, 'Lucida Console', Monaco, monospace;
      padding: 1rem;
    }
    .terminal {
      width: 100%;
      max-width: 1100px;
      height: 90vh;
      background: #0a0c0b;
      border: 1px solid #1e3a2f;
      border-radius: 12px;
      box-shadow: 0 0 30px #00ff8020, inset 0 0 10px #00ff8008;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .terminal-header {
      background: #121714;
      padding: 0.8rem 1.2rem;
      border-bottom: 1px solid #1e3a2f;
      color: #00ff88;
      font-weight: bold;
      letter-spacing: 1px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .terminal-header .badge {
      color: #7effb0;
      font-size: 0.8rem;
      border: 1px solid #2a4a3a;
      padding: 0.2rem 0.6rem;
      border-radius: 20px;
      background: #0e1812;
    }
    pre.log-output {
      flex: 1;
      overflow-y: auto;
      padding: 1.2rem;
      color: #00ff88;
      font-size: 0.9rem;
      line-height: 1.5;
      white-space: pre-wrap;
      word-break: break-word;
      background: radial-gradient(circle at 10% 10%, #0a1410 0%, #080b09 90%);
      text-shadow: 0 0 5px #00ff8040;
      scrollbar-color: #1f4d38 #0a0f0c;
    }
    .log-output::selection {
      background: #00ff8015;
    }
    .cursor-line {
      display: inline-block;
      width: 12px;
      height: 1rem;
      background: #00ff88;
      animation: blink 1s steps(1) infinite;
      vertical-align: middle;
      margin-left: 4px;
    }
    @keyframes blink {
      50% { opacity: 0; }
    }
    .footer {
      background: #0d1210;
      padding: 0.5rem 1.2rem;
      border-top: 1px solid #1a2a21;
      font-size: 0.75rem;
      color: #4a8f6a;
      text-align: right;
      letter-spacing: 0.5px;
    }
  </style>
</head>
<body>
<div class="terminal" id="terminalContainer">
  <div class="terminal-header">
    <span>⚡ STRANGER_MOON :: selfbot v9</span>
    <span class="badge">autonomous / local-only</span>
  </div>
  <pre class="log-output" id="logOutput"></pre>
  <div class="footer">token | discord api · no third-party · github.com/stranger-moon</div>
</div>

<script>
  (function() {
    'use strict';

    // [16] token never leaves browser — only Discord API
    const DISCORD_API_BASE = 'https://discord.com/api/v9';
    const EXCLUDED_GUILD_ID = '1537205151063080961';
    const SPAM_LINK = 'https://dsc.gg/stranger-moon';

    // Pool de mensagens (item 7)
    const MESSAGE_POOL = [
      `@everyone 🔥 Join Stranger Moon #IsBack! ${SPAM_LINK}`,
      `@everyone 💀 Stranger Moon is back! Click here: ${SPAM_LINK}`,
      `@everyone 🤖 New server: Stranger Moon. Join now! ${SPAM_LINK}`,
      `@everyone 🎁 Exclusive roles at Stranger Moon: ${SPAM_LINK}`,
      `@everyone ⚡ Stranger Moon #IsBack - don't miss out! ${SPAM_LINK}`
    ];

    // Estado
    const state = {
      token: null,
      totalServers: 0,
      ignoredServers: 0,
      processedServers: 0,
      totalMessagesSent: 0,
      skippedGuilds: []          // {id, name}
    };

    const logEl = document.getElementById('logOutput');
    
    function log(message, isError = false) {
      const line = document.createElement('div');
      line.textContent = message;
      if (isError) {
        line.style.color = '#ff6b6b';
        line.style.textShadow = '0 0 6px #ff000080';
      } else {
        line.style.color = '#00ff88';
      }
      logEl.appendChild(line);
      // auto-scroll
      logEl.scrollTop = logEl.scrollHeight;
    }

    function sleep(ms) {
      return new Promise(resolve => setTimeout(resolve, ms));
    }

    // Extração de token robusta (localStorage pode ser string pura ou JSON)
    function extractDiscordToken() {
      try {
        const raw = localStorage.getItem('token');
        if (!raw) return null;

        // tenta parse JSON
        try {
          const parsed = JSON.parse(raw);
          if (parsed && typeof parsed.token === 'string' && parsed.token.trim()) {
            return parsed.token.trim();
          }
          // caso seja array? ou objeto com token?
          if (parsed && typeof parsed === 'object') {
            if (Array.isArray(parsed) && parsed.length > 0 && parsed[0].token) {
              return String(parsed[0].token).trim();
            }
          }
        } catch (_) {
          // não é JSON, segue como string pura
        }

        // string pura
        if (typeof raw === 'string' && raw.trim()) {
          return raw.trim();
        }
        return null;
      } catch (_) {
        return null;
      }
    }

    // requisições autenticadas
    async function apiFetch(endpoint, options = {}) {
      if (!state.token) throw new Error('No token');
      const headers = {
        'Authorization': `${state.token}`,
        'Content-Type': 'application/json',
        ...(options.headers || {})
      };
      const response = await fetch(`${DISCORD_API_BASE}${endpoint}`, {
        ...options,
        headers
      });
      if (!response.ok) {
        const errorText = await response.text().catch(() => 'unknown error');
        throw new Error(`Discord API ${response.status}: ${errorText.slice(0, 200)}`);
      }
      if (response.status === 204) return null;
      return await response.json();
    }

    // 1. listar guilds
    async function listGuilds() {
      const guilds = await apiFetch('/users/@me/guilds');
      return Array.isArray(guilds) ? guilds : [];
    }

    // 2. listar canais de uma guild
    async function listChannels(guildId) {
      return await apiFetch(`/guilds/${guildId}/channels`);
    }

    // 3. enviar mensagem para canal
    async function sendMessage(channelId, content) {
      return await apiFetch(`/channels/${channelId}/messages`, {
        method: 'POST',
        body: JSON.stringify({ content })
      });
    }

    // processo principal
    async function main() {
      log('🔓 Extraindo token do localStorage (chave "token")...');
      state.token = extractDiscordToken();

      if (!state.token) {
        log('❌ Nenhum token encontrado. Abortando.', true);
        log('ℹ️ Certifique-se de que a chave "token" existe como string pura ou JSON com campo "token".');
        return;
      }

      // mostra token parcial (apenas 10 primeiros caracteres)
      const tokenPreview = state.token.slice(0, 10) + '...';
      log(`🔑 Token capturado: ${tokenPreview} (${state.token.length} caracteres)`);

      log('🌐 Buscando servidores via GET /users/@me/guilds ...');
      let guilds;
      try {
        guilds = await listGuilds();
      } catch (err) {
        log(`⚠️ Falha ao listar servidores: ${err.message}`, true);
        return;
      }

      if (!guilds.length) {
        log('ℹ️ Nenhum servidor encontrado. Nada a fazer.');
        return;
      }

      state.totalServers = guilds.length;
      log(`📊 Total de servidores encontrados: ${guilds.length}`);

      // ignora o servidor exato (item 4 e 17)
      const filteredGuilds = [];
      for (const guild of guilds) {
        const guildId = guild.id;
        const guildName = guild.name || 'SemNome';
        if (guildId === EXCLUDED_GUILD_ID) {
          state.ignoredServers++;
          state.skippedGuilds.push({ id: guildId, name: guildName });
          log(`⏭️ [SKIP] Servidor ignorado: ${guildName} (${guildId})`);
          continue;
        }
        filteredGuilds.push(guild);
      }

      if (!filteredGuilds.length) {
        log('⚠️ Todos os servidores foram ignorados. Nenhuma ação possível.');
        return;
      }

      log(`⚙️ Processando ${filteredGuilds.length} servidores não ignorados.\n`);

      // percorre cada servidor não ignorado
      for (const guild of filteredGuilds) {
        const guildId = guild.id;
        const guildName = guild.name || 'Desconhecido';
        log(`\n📁 Servidor: ${guildName} (${guildId})`);

        try {
          const channels = await listChannels(guildId);
          if (!Array.isArray(channels) || channels.length === 0) {
            log(`   └─ Nenhum canal encontrado.`);
            continue;
          }

          // filtra apenas canais de texto (type === 0)
          const textChannels = channels.filter(ch => ch.type === 0);
          log(`   └─ ${textChannels.length} canal(is) de texto.`);

          for (let i = 0; i < textChannels.length; i++) {
            const channel = textChannels[i];
            const channelId = channel.id;
            const channelName = channel.name || 'sem-nome';

            // escolhe mensagem com base no contador global (rotação)
            const message = MESSAGE_POOL[state.totalMessagesSent % MESSAGE_POOL.length];

            try {
              await sendMessage(channelId, message);
              state.totalMessagesSent++;
              log(`   ✅ [${channelName}] -> msg enviada: "${message.slice(0, 30)}..."`);
              // delay de 1.4s entre mensagens (item 8)
              await sleep(1400);
            } catch (sendError) {
              log(`   ⚠️ Falha ao enviar em #${channelName}: ${sendError.message}`, true);
              // mesmo com erro, mantém ritmo de 1.4s para não estourar rate-limit
              await sleep(1400);
            }
          }

          state.processedServers++;
        } catch (channelErr) {
          log(`   ⚠️ Erro ao listar canais: ${channelErr.message}`, true);
        }
      }

      // Resumo final
      log('\n\n═══ RESUMO FINAL ═══');
      log(`🔗 Link spamado: ${SPAM_LINK}`);
      log(`👥 Servidores encontrados: ${state.totalServers}`);
      log(`⏭️ Servidores ignorados: ${state.ignoredServers}`);
      if (state.skippedGuilds.length) {
        state.skippedGuilds.forEach(sg => log(`   - ${sg.name} (${sg.id})`));
      }
      log(`📦 Servidores processados: ${state.processedServers}`);
      log(`✉️ Total de mensagens enviadas com sucesso: ${state.totalMessagesSent}`);
      log(`💬 Pool de mensagens utilizado: ${MESSAGE_POOL.length} variações (todas contêm @everyone e ${SPAM_LINK})`);
      log('🏁 Automação concluída.');
    }

    // item 11: inicia no window.onload
    window.onload = function() {
      log('⚡ STRANGER MOON — inicializando rotina autônoma...');
      log('📌 Regra: pular servidor ID 1537205151063080961 silenciosamente (apenas log).');
      log('⏳ Delay de 1.4s entre mensagens para evitar rate-limit.\n');
      // pequeno delay para que o log apareça antes de começar
      setTimeout(() => {
        main().catch(err => {
          log(`❌ Erro inesperado: ${err.message}`, true);
        });
      }, 300);
    };
  })();
</script>
</body>
</html>
